services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: oddnote
      POSTGRES_USER: oddnote
      POSTGRES_PASSWORD: oddnotepass
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # MinIO console
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://oddnote:oddnotepass@db:5432/oddnote
      APP_URL: http://localhost:5173
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: this-is-a-long-dev-access-secret-at-least-32-chars
      JWT_REFRESH_SECRET: this-is-a-long-dev-refresh-secret-at-least-32-chars
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM: noreply@oddnote.local
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: oddnote-uploads
      S3_USE_SSL: false
      API_PORT: 4000
    depends_on:
      - db
      - minio
    ports:
      - '4000:4000'

volumes:
  db-data:
  minio-data:
