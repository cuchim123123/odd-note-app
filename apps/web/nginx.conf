server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Docker internal DNS resolver (prevents 502 Bad Gateway if backend restarts and gets new IP)
    resolver 127.0.0.11 valid=10s;

    # Standard Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (for attachments, avatars, etc.)
    client_max_body_size 50M;

    # Serve static frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        # Cache control for assets
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, no-transform";
        }
    }

    # Proxy API requests to NestJS Backend
    location /api {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for uploads
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Proxy WebSocket connections correctly (Socket.io)
    location /socket.io/ {
        set $socket_upstream http://api:4000;
        proxy_pass $socket_upstream;
        proxy_http_version 1.1;
        
        # Upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Set timeouts for persistent websocket connections
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Proxy public MinIO S3 file access
    # When frontend requests files, it goes through Nginx, keeping MinIO completely private!
    location /uploads/ {
        # Rewrite url from /uploads/bucketname/filename to /bucketname/filename
        rewrite ^/uploads/(.*)$ /$1 break;
        
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Caching for static uploads
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
