services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: oddnote
      POSTGRES_USER: oddnote
      POSTGRES_PASSWORD: oddnotepass
    ports:
      - '54320:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    command: sh -lc "pnpm --filter @odd-note-app/validation build && pnpm --filter @odd-note-app/api prisma:generate && pnpm --filter @odd-note-app/api dev"
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      NODE_ENV: development
      DATABASE_URL: postgres://oddnote:oddnotepass@db:5432/oddnote
      APP_URL: http://localhost:5174
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: this-is-a-long-dev-access-secret-at-least-32-chars
      JWT_REFRESH_SECRET: this-is-a-long-dev-refresh-secret-at-least-32-chars
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM: noreply@oddnote.local
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: oddnote-uploads
      S3_USE_SSL: false
      API_PORT: 4000
      ALLOW_TEST_ENDPOINTS: '1'
    depends_on:
      - redis
      - db
      - minio
    volumes:
      - .:/workspace
      - api-node-modules:/workspace/node_modules
      - api-app-node-modules:/workspace/apps/api/node_modules
      - api-validation-node-modules:/workspace/packages/validation/node_modules
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    command: sh -lc "pnpm --filter @odd-note-app/validation build && pnpm --filter @odd-note-app/web dev --host 0.0.0.0 --strictPort --port 5174"
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      VITE_API_URL: http://localhost:4000/api
      VITE_WS_URL: http://localhost:4000
    depends_on:
      - api
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/node_modules
      - web-app-node-modules:/workspace/apps/web/node_modules
      - web-validation-node-modules:/workspace/packages/validation/node_modules
    ports:
      - '5174:5174'

volumes:
  redis-data:
  db-data:
  minio-data:
  api-node-modules:
  api-app-node-modules:
  api-validation-node-modules:
  web-node-modules:
  web-app-node-modules:
  web-validation-node-modules:
