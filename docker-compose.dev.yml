services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    ports:
      - '9092:9092'
      - '29092:29092'
    environment:
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_HEAP_OPTS: '-Xmx256M -Xms256M'

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: oddnote
      POSTGRES_USER: oddnote
      POSTGRES_PASSWORD: oddnotepass
    ports:
      - '54320:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  mongodb:
    image: mongo:latest
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data/db

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI → mở http://localhost:8025 để xem mail

  api:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    command: sh -lc "pnpm --filter @odd-note-app/validation build && pnpm --filter @odd-note-app/api prisma:generate && pnpm --filter @odd-note-app/api dev"
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgres://oddnote:oddnotepass@db:5432/oddnote}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/oddnote}
      APP_URL: ${APP_URL:-http://localhost:5174}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-this-is-a-long-dev-access-secret-at-least-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-this-is-a-long-dev-refresh-secret-at-least-32-chars}
      JWT_NOTE_UNLOCK_SECRET: ${JWT_NOTE_UNLOCK_SECRET:-this-is-a-long-dev-note-unlock-secret}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@oddnote.local}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio}
      S3_PORT: ${S3_PORT:-9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-oddnote-uploads}
      S3_USE_SSL: false
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      API_PORT: 4000
      ALLOW_TEST_ENDPOINTS: '1'
      KAFKA_BROKER: kafka:9092
    depends_on:
      - redis
      - db
      - mongodb
      - minio
      - kafka
      - mailpit
    volumes:
      - .:/workspace
      - api-node-modules:/workspace/node_modules
      - api-app-node-modules:/workspace/apps/api/node_modules
      - api-validation-node-modules:/workspace/packages/validation/node_modules
    ports:
      - '4000:4000'
      - '9229:9229'

  web:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    command: sh -lc "pnpm --filter @odd-note-app/validation build && pnpm --filter @odd-note-app/web dev --host 0.0.0.0 --strictPort --port 5174"
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      VITE_API_URL: http://localhost:4000/api
      VITE_WS_URL: http://localhost:4000
    depends_on:
      - api
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/node_modules
      - web-app-node-modules:/workspace/apps/web/node_modules
      - web-validation-node-modules:/workspace/packages/validation/node_modules
    ports:
      - '5174:5174'

volumes:
  redis-data:
  db-data:
  mongodb-data:
  minio-data:
  api-node-modules:
  api-app-node-modules:
  api-validation-node-modules:
  web-node-modules:
  web-app-node-modules:
  web-validation-node-modules:
